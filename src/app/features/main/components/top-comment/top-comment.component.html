<section aria-label="Top comment" class="group/card relative mx-5 my-5 sm:mx-6">
    <div class="rounded-card bg-linear-to-br from-brand-400/70 via-border to-brand-700/50 p-px">

        <div class="relative isolate rounded-[calc(1rem-1px)] bg-surface p-4 sm:p-5">
            <div
                class="absolute top-0 -translate-y-1/2 w-fit rounded-full bg-primary-soft py-1 ps-2 pe-2.5 text-[10px] font-semibold tracking-wide text-primary ring-1 ring-primary/15">
                Top comment
            </div>

            <div class="mt-4 flex items-stretch gap-3">

                <div class="flex shrink-0 flex-col items-center">
                    <div
                        class="rounded-full bg-linear-to-tr from-brand-300 via-brand-500 to-brand-800 p-0.5 transition-transform duration-300 group-hover/card:rotate-6">
                        <img [src]="comment().commentCreator.photo" [alt]="comment().commentCreator.name.trim()"
                            loading="lazy" class="size-10 rounded-full object-cover ring-2 ring-surface" />
                    </div>
                    <span class="mt-2 w-px flex-1 rounded-full bg-linear-to-b from-primary/50 to-transparent"></span>
                </div>

                <div class="relative min-w-0 flex-1">
                    <div
                        class="rounded-2xl rounded-ss rounded-tl-0 bg-surface-secondary/70 px-4 py-3 ring-1 ring-border/60 backdrop-blur-sm">

                        <p class="font-heading text-[13px] font-semibold text-text-primary">
                            {{ comment().commentCreator.name.trim() }}
                        </p>

                        @if (comment().content) {
                        <p dir="auto" class="md:mt-1.5 text-sm leading-6 text-text-secondary [overflow-wrap:anywhere]">
                            {{ comment().content }}
                        </p>
                        }

                        @if (comment().image) {
                        <div class="mt-3 overflow-hidden rounded-xl ring-1 ring-border/60">
                            <img [src]="comment().image" alt="Comment image" loading="lazy"
                                class="max-h-44 w-full object-cover transition-transform duration-500 hover:scale-105" />
                        </div>
                        }
                    </div>
                </div>
            </div>

            @if (commentsCount() > 1) {
            <button type="button" (click)="openPostEngagement('comments')"
                class="group mt-4 block ms-auto text-xs font-semibold text-text-muted transition-colors hover:text-primary">

                @if (!showEngagement()){
                View all {{ commentsCount() | number }} comments
                }
                @else {
                hidden comments
                }
            </button>
            }
        </div>
    </div>
</section>


@if (showEngagement()) {
<article class="flex-1 overflow-y-auto overflow-x-hidden h-[80vh] bg-surface">
    <app-post-comments [postId]="postId()"></app-post-comments>
</article>
}
