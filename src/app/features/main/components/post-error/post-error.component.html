<div class="mb-6 overflow-hidden rounded-card border border-danger/25 bg-surface shadow-card">
    <div class="h-1 w-full bg-linear-to-r from-danger/70 via-danger to-danger/70"></div>

    <div class="flex flex-col gap-4 p-5 sm:flex-row sm:items-center sm:justify-between">
        <div class="flex items-start gap-3.5">
            <div
                class="flex size-11 shrink-0 items-center justify-center rounded-xl border border-danger/20 bg-danger/10 text-danger">
                <svg class="size-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
                </svg>
            </div>

            <div class="min-w-0 flex-1">
                <div class="flex flex-wrap items-center gap-2">
                    <h2 class="font-heading text-sm font-bold text-text-primary sm:text-base">
                        Couldn't load posts
                    </h2>
                    <span class="rounded-full bg-danger/10 px-2 py-0.5 text-[11px] font-semibold text-danger">
                        Connection issue
                    </span>
                </div>

                <p class="mt-1 text-xs leading-relaxed text-text-secondary sm:text-sm">
                    {{ message() }}
                </p>
            </div>
        </div>

        <div class="flex shrink-0 items-center justify-end gap-2 pt-3 sm:pt-0">
            <button type="button" (click)="retry.emit()" [disabled]="isRetrying()"
                class="inline-flex w-full items-center justify-center gap-2 rounded-button bg-danger px-4 py-2 text-xs font-semibold text-white shadow-2xs transition-all hover:bg-danger/90 focus-visible:ring-4 focus-visible:ring-danger/20 focus-visible:outline-none active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-60 sm:w-auto sm:text-sm">
                <i class="fa-solid fa-arrows-rotate transition-transform duration-500 group-hover:rotate-180 motion-reduce:transition-none"
                    [class.animate-spin]="isRetrying()"></i>
                <span>{{ isRetrying() ? 'Retrying...' : 'Try again' }}</span>
            </button>
        </div>
    </div>
</div>
