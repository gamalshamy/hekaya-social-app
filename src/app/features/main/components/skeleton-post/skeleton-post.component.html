<div class="space-y-4">
    @for (i of [1, 2, 3]; track i) {
    <div class="animate-pulse rounded-card border border-border bg-surface p-5 shadow-card">
        <div class="flex items-center gap-3">
            <div class="size-11 rounded-full bg-surface-secondary"></div>
            <div class="flex-1 space-y-2">
                <div class="h-3 w-1/3 rounded bg-surface-secondary"></div>
                <div class="h-2.5 w-1/4 rounded bg-surface-secondary"></div>
            </div>
        </div>
        <div class="mt-5 space-y-2.5">
            <div class="h-3 w-full rounded bg-surface-secondary"></div>
            <div class="h-3 w-11/12 rounded bg-surface-secondary"></div>
            <div class="h-3 w-2/3 rounded bg-surface-secondary"></div>
        </div>
        <div class="mt-6 h-9 rounded-button bg-surface-secondary"></div>
    </div>
    }
</div>
